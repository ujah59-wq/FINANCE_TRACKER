<!doctype html><html lang="en-GB" data-mode="light" data-th="ocean"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Money Tracker</title>
<style>
:root[data-mode=light]{--tx:#14213a;--tx2:#475574;--glass:rgba(255,255,255,.45);--bd:rgba(255,255,255,.75);--inp:rgba(255,255,255,.62);--sh:rgba(40,70,140,.18);--good:#0a7a40;--bad:#c4162c;--onacc:#fff;color-scheme:light}
:root[data-mode=dark]{--tx:#f2f6ff;--tx2:#aab6d4;--glass:rgba(28,32,60,.45);--bd:rgba(255,255,255,.16);--inp:rgba(255,255,255,.09);--sh:rgba(0,0,0,.5);--good:#52e08e;--bad:#ff7a8a;--onacc:#0b1020;color-scheme:dark}
[data-mode=light][data-th=ocean]{--bg1:#dbe8ff;--bg2:#ffe3f1;--b1:#6aa8ff;--b2:#ff9ccf;--b3:#8ff0d0;--acc:#0a5fe0}
[data-mode=dark][data-th=ocean]{--bg1:#070a1c;--bg2:#150a2b;--b1:#2457d6;--b2:#8a2be2;--b3:#0e9f8a;--acc:#6cb0ff}
[data-mode=light][data-th=sunset]{--bg1:#ffe8d6;--bg2:#ffd6e8;--b1:#ff9a6a;--b2:#ff6f9c;--b3:#ffd166;--acc:#b93c0a}
[data-mode=dark][data-th=sunset]{--bg1:#1c0b0b;--bg2:#26091c;--b1:#c2410c;--b2:#be185d;--b3:#b45309;--acc:#ffa36b}
[data-mode=light][data-th=forest]{--bg1:#e0f5e4;--bg2:#e6f4ff;--b1:#5fd38d;--b2:#7dd3fc;--b3:#d9f99d;--acc:#0f7a3e}
[data-mode=dark][data-th=forest]{--bg1:#06150c;--bg2:#07181c;--b1:#15803d;--b2:#0e7490;--b3:#4d7c0f;--acc:#6ee7a0}
[data-mode=light][data-th=orchid]{--bg1:#f0e6ff;--bg2:#ffe6f7;--b1:#b794f6;--b2:#f9a8d4;--b3:#a5b4fc;--acc:#7a2fe6}
[data-mode=dark][data-th=orchid]{--bg1:#100a20;--bg2:#1f0a1c;--b1:#6d28d9;--b2:#a21caf;--b3:#4338ca;--acc:#c4a1ff}
[data-mode=light][data-th=graphite]{--bg1:#eceef2;--bg2:#dfe3ea;--b1:#aab4c8;--b2:#cbd5e1;--b3:#94a3b8;--acc:#334155}
[data-mode=dark][data-th=graphite]{--bg1:#0b0c10;--bg2:#14161c;--b1:#3b4252;--b2:#475569;--b3:#1e293b;--acc:#cbd5e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 96px)}
.bl{position:fixed;border-radius:50%;filter:blur(55px);opacity:.75;z-index:-1;animation:fl 18s ease-in-out infinite alternate}
.bl:nth-child(1){width:60vw;height:60vw;background:var(--b1);top:-10vw;left:-15vw}
.bl:nth-child(2){width:55vw;height:55vw;background:var(--b2);top:35vh;right:-20vw;animation-delay:-6s}
.bl:nth-child(3){width:50vw;height:50vw;background:var(--b3);bottom:-10vw;left:10vw;animation-delay:-11s}
@keyframes fl{to{transform:translate(8vw,-6vh) scale(1.15)}}
#app{max-width:560px;margin:auto}
.top{display:flex;align-items:center;gap:10px;margin:6px 2px 12px}.top h1{flex:1}
h1{font-size:26px;margin:0;letter-spacing:-.5px}h3{margin:0 0 8px;font-size:16px}
.card,.tabs,.tb{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--bd);box-shadow:0 8px 30px var(--sh),inset 0 1px 0 rgba(255,255,255,.35)}
.card{border-radius:24px;padding:14px;margin-bottom:12px}
.tb{border-radius:20px;padding:8px 13px;color:var(--tx);font:600 14px inherit;cursor:pointer}
.tabs{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:532px;margin:auto;border-radius:30px;display:flex;padding:6px;z-index:5}
.tab{flex:1;border:0;background:none;color:var(--tx2);padding:8px 0;border-radius:24px;font:600 12px inherit;cursor:pointer}
.tab b{display:block;font-size:19px}.tab.on{background:var(--inp);color:var(--acc)}
.big{font-size:34px;font-weight:700;letter-spacing:-1px}.mut{color:var(--tx2);font-size:12px}
.good{color:var(--good)}.bad{color:var(--bad)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--inp);border-radius:16px;padding:10px}.st b{display:block;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}.row:last-child{border:0}
.lk{cursor:pointer}
input,select{width:100%;min-width:0;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px;font:inherit}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);padding:0}
label{display:block;font-size:11px;color:var(--tx2);margin:2px 0}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:16px;padding:11px;background:var(--acc);color:var(--onacc);font:600 15px inherit;cursor:pointer;margin-top:8px}
.btn.s{background:var(--inp);color:var(--acc)}
.x{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer}
.bk{border:0;background:var(--inp);color:var(--acc);font:600 15px inherit;border-radius:16px;padding:8px 14px;margin-bottom:10px;cursor:pointer}
.r{display:grid;gap:5px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}.r input{padding:7px 5px}.r input[type=checkbox]{justify-self:end}
.hd{font-size:11px;font-weight:700;color:var(--tx2)}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right}.tbl th{font-size:11px;color:var(--tx2)}.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl tr:last-child td{border:0;font-weight:700}
.nav{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:10px}
.nav button{border:0;background:var(--inp);color:var(--tx);width:36px;height:36px;border-radius:50%;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cd{border-radius:12px;padding:4px 0;min-height:44px;font-size:13px;cursor:pointer;background:var(--inp)}
.cd.sel{outline:2px solid var(--acc)}.cd.td{font-weight:800;color:var(--acc)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin:1px}.dot.k{background:var(--good)}
.cd small{display:block;font-size:9px;color:var(--tx2)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.lks{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.lk2{flex:none;width:72px;text-align:center;text-decoration:none;color:var(--tx);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}
.lk2 span.t{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{border:2px solid transparent;border-radius:14px;padding:8px 10px;background:var(--inp);color:var(--tx);font:600 12px inherit}.sw button.on{border-color:var(--acc)}.sw i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px}
.seg{display:flex;gap:6px}.seg button{flex:1;border:0;border-radius:12px;padding:9px;background:var(--inp);color:var(--tx);font:600 13px inherit}.seg button.on{background:var(--acc);color:var(--onacc)}
.sh{background:var(--inp);border-radius:14px;padding:8px;margin-bottom:8px}
html,body{touch-action:manipulation}input,select{font-size:16px}textarea{width:100%;min-height:90px;background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px;font:inherit;font-size:16px}.tbs{overflow-x:auto}.tbs .r{min-width:372px}
details summary{cursor:pointer;color:var(--acc);font-weight:600;margin:6px 0}
</style></head><body>
<div class="bl"></div><div class="bl"></div><div class="bl"></div>
<div id="app"></div>
<nav class="tabs"><button class="tab" data-t="sum" onclick="go('sum')"><b>◎</b>Summary</button><button class="tab" data-t="inc" onclick="V.st=null;go('inc')"><b>£</b>Income</button><button class="tab" data-t="mon" onclick="go('mon')"><b>▦</b>Month</button></nav>
<script>
const $=s=>document.querySelector(s);
let S={theme:'auto',pal:'ocean',name:'',prof:'',links:[],streams:[],shifts:[],months:{},owed:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('mt')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('mt',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const sm=(m,n)=>{const[y,o]=m.split('-');return ym(new Date(+y,+o-1+n,1))};
const mn=m=>{const[y,o]=m.split('-');return new Date(+y,+o-1,1).toLocaleString('en-GB',{month:'long',year:'numeric'})};
const gbp=n=>'£'+(+n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I=(v,on,t='text',ph='')=>`<input type="${t}" ${t=='number'?'inputmode="decimal" step="any"':''} value="${E(v)}" placeholder="${ph}" onchange="${on}">`;
const C=(v,on)=>`<input type="checkbox" ${v?'checked':''} onchange="${on}">`;
const L=(l,i)=>`<div><label>${l}</label>${i}</div>`;
const tot=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const av=(img,n,z)=>`<span class="av" style="width:${z}px;height:${z}px;font-size:${z/2.3}px">${img?`<img src="${img}" alt="">`:E((n||'?')[0].toUpperCase())}</span>`;
const fu=u=>/^https?:\/\//i.test(u)?u:/^[a-z]+:/i.test(u)?'#':'https://'+u;
const PAL={ocean:['Ocean','#6aa8ff','#8ff0d0'],sunset:['Sunset','#ff9a6a','#ff6f9c'],forest:['Forest','#5fd38d','#7dd3fc'],orchid:['Orchid','#b794f6','#f9a8d4'],graphite:['Graphite','#94a3b8','#475569']};
const today=new Date(),cm=ym(today);
const TL=[{n:'Oct – Dec 2026',s:'2026-10',e:'2026-12'},{n:'Jan – Dec 2027',s:'2027-01',e:'2027-12'}];
let V={tab:'sum',tl:0,sel:null,st:null,ed:false,msg:''};
V.tl=S.tl!=null&&TL[S.tl]?S.tl:(cm<=TL[0].e?0:1);
const cl=m=>m<TL[V.tl].s?TL[V.tl].s:m>TL[V.tl].e?TL[V.tl].e:m;
V.m=V.im=V.cal=cl(cm);
function setTl(i){V.tl=i;S.tl=i;save();V.m=V.im=V.cal=cl(cm);V.sel=null;V.st=null;render()}
const M=m=>S.months[m]||(S.months[m]={bills:[],exp:[],sav:[],debt:[]});
const rt=(g,s)=>+(g>+s.l2?s.t3:g>+s.l1?s.t2:s.t1);
const net=(g,s)=>g*(1-rt(g,s)/100);
const dstr=d=>ym(d)+'-'+String(d.getDate()).padStart(2,'0');
const lastD=m=>{const[y,o]=m.split('-');return dstr(new Date(+y,+o,0))};
const addD=(ds,n)=>{const[y,o,d]=ds.split('-');return dstr(new Date(+y,+o-1,+d+n))};
const cut=(s,m)=>(s.cut&&s.cut[m])||lastD(m);
const per=(s,m)=>[addD(cut(s,sm(m,-1)),1),cut(s,m)];
const inP=(s,m,d)=>{const q=per(s,m);return d>=q[0]&&d<=q[1]};
function inc(m,done){const r={h:0,g:0,n:0,per:[]};S.streams.forEach(s=>{const ft=s.type=='ft',h=ft?0:S.shifts.filter(x=>x.s==s.id&&inP(s,m,x.d)&&(!done||x.k)).reduce((a,x)=>a+(+x.h||0),0),g=ft?((!done||(s.paid&&s.paid[m]))?+s.sal||0:0):h*s.rate,n=net(g,s);r.h+=h;r.g+=g;r.n+=n;r.per.push({s,h,g,n})});return r}
const allM=()=>{const o=[];for(let m=TL[V.tl].s;m<=TL[V.tl].e;m=sm(m,1))o.push(m);return o};
function u(c,id,k,v){const o=S[c].find(x=>x.id==id);if(o){o[k]=v;save();render()}}
function del(c,id){S[c]=S[c].filter(x=>x.id!=id);save();render()}
function mi(m,s,id,k,v){M(m)[s].find(x=>x.id==id)[k]=v;save();render()}
function md(m,s,id){M(m)[s]=M(m)[s].filter(x=>x.id!=id);save();render()}
function ma(m,s){M(m)[s].push({id:uid(),n:'',p:0,a:0,d:0,k:false});save();render()}
function ast(){const id=uid();S.streams.push({id,name:'',img:'',b:false,i:false,type:'pt',sal:0,cut:{},paid:{},rate:12,t1:20,t2:28,t3:42,l1:1048,l2:4189});V.st=id;V.ed=true;save();render()}
function ash(sid,d){const m=V.im;S.shifts.push({id:uid(),s:sid,d:d||(ym(today)==m?today.toISOString().slice(0,10):m+'-01'),h:8,n:'',k:false});save();render()}
function quick(d){if(!S.streams.some(s=>s.type!='ft')){V.tab='inc';V.st=null;return render()}V.im=d.slice(0,7);V.st=S.streams.find(s=>s.type!='ft').id;V.ed=false;ash(V.st,d);V.tab='inc'}
function go(t,m){V.tab=t;V.msg='';if(m)V.m=cl(m);scrollTo(0,0);render()}
function mv(k,n){V[k]=cl(sm(V[k],n));if(k=='cal')V.sel=null;render()}
const pj=()=>JSON.stringify({app:'money-tracker',v:1,data:S});
function expF(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pj()],{type:'application/json'}));a.download='money-tracker-profile.json';document.body.appendChild(a);a.click();a.remove();V.msg='Export started (check Downloads / Files).';render()}
async function expC(){try{await navigator.clipboard.writeText(pj());V.msg='Profile copied. Paste it somewhere safe.'}catch(e){V.msg='Copy was blocked — use Export file instead.'}render()}
function imp(txt){try{const j=JSON.parse(txt),d=j.data||j;if(!d||!Array.isArray(d.streams))throw 0;S=Object.assign({theme:'auto',pal:'ocean',name:'',prof:'',links:[],streams:[],shifts:[],months:{},owed:[]},d);save();V.tl=S.tl!=null&&TL[S.tl]?S.tl:V.tl;V.m=V.im=V.cal=cl(cm);V.st=null;V.sel=null;V.msg='Profile imported.'}catch(e){V.msg='Import failed: not a valid profile.'}render()}
function impF(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f)}
function setCut(id,m,v){const o=S.streams.find(x=>x.id==id);o.cut=o.cut||{};o.cut[m]=v;save();render()}
function setPaid(id,m,v){const o=S.streams.find(x=>x.id==id);o.paid=o.paid||{};o.paid[m]=v;save();render()}
function delS(id){if(V.dc!=id){V.dc=id;return render()}V.dc=null;S.shifts=S.shifts.filter(x=>x.s!=id);S.streams=S.streams.filter(x=>x.id!=id);V.st=null;V.ed=false;save();render()}
function pic(el,c,id){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,240/Math.max(i.width,i.height)),cv=document.createElement('canvas');cv.width=i.width*k;cv.height=i.height*k;cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);const d=cv.toDataURL('image/jpeg',.82);if(c=='prof'){S.prof=d;save();render()}else u(c,id,'img',d)};i.src=r.result};r.readAsDataURL(f)}
const up=(c,id,z)=>`<label class="btn s" style="margin:6px 0">Choose picture<input type="file" accept="image/*" hidden onchange="pic(this,'${c}','${id}')"></label>`;
function apply(){const d=document.documentElement;d.dataset.mode=S.theme=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):S.theme;d.dataset.th=S.pal}
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply)}catch(e){}
const nm=s=>`<span style="font-weight:${s.b?800:600};font-style:${s.i?'italic':'normal'}">${E(s.name||'New stream')}</span>`;
const mnav=k=>`<div class="nav"><button onclick="mv('${k}',-1)">‹</button>${mn(V[k])}<button onclick="mv('${k}',1)">›</button></div>`;

function chart(){const ms=allM();if(!ms.some(m=>inc(m).g>0))return '<div class="mut">Add shifts to see the graph.</div>';
const v=ms.map(m=>inc(m).n),mx=Math.max(...v,1),w=300/ms.length,avg=v.reduce((a,b)=>a+b,0)/v.length;
return `<svg viewBox="0 0 320 150" width="100%">${ms.map((m,i)=>{const h=v[i]/mx*95,x=10+i*w;return `<rect x="${x+w*.15}" y="${120-h}" width="${w*.7}" height="${h}" rx="4" fill="var(--acc)" opacity=".85"/><text x="${x+w/2}" y="${114-h}" font-size="8" text-anchor="middle" fill="var(--tx)">${Math.round(v[i])}</text><text x="${x+w/2}" y="136" font-size="8" text-anchor="middle" fill="var(--tx2)">${mn(m).slice(0,3)}</text>`}).join('')}<line x1="10" x2="310" y1="120" y2="120" stroke="var(--tx2)" stroke-width=".5"/><line x1="10" x2="310" y1="${120-avg/mx*95}" y2="${120-avg/mx*95}" stroke="var(--good)" stroke-dasharray="4 3"/></svg><div class="mut">Net income per month · dashed line = average per month</div>`}

function pSum(){const ms=allM();let sv=0,pj=0,g=0,n=0,c=0;
ms.forEach(m=>{sv+=tot(M(m).sav,'a');pj+=tot(M(m).sav,'p');const i=inc(m);g+=i.g;n+=i.n;c++});
const cc=cl(cm),a=inc(cc),r=inc(cc,true),b=inc(sm(cc,1)),mx=Math.max(1,...ms.map(m=>inc(m).n));
const[y,o]=V.cal.split('-'),off=(new Date(+y,+o-1,1).getDay()+6)%7,nd=new Date(+y,+o,0).getDate();
let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
for(let d=1;d<=nd;d++){const ds=V.cal+'-'+String(d).padStart(2,'0'),sh=S.shifts.filter(x=>x.d==ds),h=sh.reduce((q,x)=>q+(+x.h||0),0);
cells+=`<div class="cd ${V.sel==ds?'sel':''} ${ds==today.toISOString().slice(0,10)?'td':''}" onclick="V.sel='${ds}';render()">${d}<div>${sh.slice(0,4).map(x=>`<span class="dot ${x.k?'k':''}"></span>`).join('')}</div>${h?`<small>${h}h</small>`:''}</div>`}
const ss=V.sel?S.shifts.filter(x=>x.d==V.sel):[];
return `<div class="seg" style="margin-bottom:12px">${TL.map((t,i)=>`<button class="${V.tl==i?'on':''}" onclick="setTl(${i})">${t.n}</button>`).join('')}</div>${S.links.length?`<div class="lks">${S.links.map(l=>`<a class="lk2" href="${E(fu(l.u))}" target="_blank" rel="noopener">${av(l.img,l.n,48)}<span class="t">${E(l.n||'Link')}</span></a>`).join('')}</div>`:''}
<div class="card"><div class="mut">Total savings to date</div><div class="big good">${gbp(sv)}</div><div class="mut">Projected savings (planned): <b>${gbp(pj)}</b></div></div>
<div class="g3" style="margin-bottom:12px">${[['Gross income',g],['Net income',n],['Saved',sv]].map(x=>`<div class="card st" style="margin:0"><span class="mut">${x[0]}</span><b>${gbp(x[1])}</b></div>`).join('')}</div>
<div class="card"><h3>Average income per month</h3><div class="mut" style="margin-bottom:8px">Total income ÷ ${ms.length} months in this timeline</div><div class="g2" style="margin-bottom:10px"><div class="st"><span class="mut">Average net income / month</span><b>${gbp(c?n/c:0)}</b></div><div class="st"><span class="mut">Average gross income / month</span><b>${gbp(c?g/c:0)}</b></div></div>${chart()}</div>
<div class="card"><h3>Calendar · shifts</h3>${mnav('cal')}
<div class="cal mut" style="margin-bottom:4px">${'MTWTFSS'.split('').map(x=>`<div>${x}</div>`).join('')}</div><div class="cal">${cells}</div>
${V.sel?`<div style="margin-top:10px"><b>${new Date(V.sel).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</b>${ss.map(x=>`<div class="row"><span>${E(x.n||'Shift')} · ${x.h}h <span class="mut">${E((S.streams.find(s=>s.id==x.s)||{}).name||'')}</span></span>${C(x.k,`u('shifts','${x.id}','k',this.checked)`)}</div>`).join('')||'<div class="mut">No shifts</div>'}<button class="btn s" onclick="quick('${V.sel}')">+ Add shift on this date</button></div>`:''}</div>
<div class="card"><h3>Income projection</h3>
<div class="row"><span>This month projected <span class="mut">(gross ${gbp(a.g)})</span></span><b>${gbp(a.n)}</b></div>
<div class="row"><span>Received so far (ticked)</span><b class="good">${gbp(r.n)}</b></div>
<div class="row"><span>Next month projected</span><b>${gbp(b.n)}</b></div>
<div class="row"><span>All months projected net</span><b>${gbp(n)}</b></div></div>
<div class="card"><h3>Months · amount saved</h3>${ms.map(m=>{const s=M(m).sav;return `<div class="row lk" onclick="go('mon','${m}')"><div style="flex:1"><b>${mn(m)}</b> <span class="mut">net ${gbp(inc(m).n)}</span></div><div style="text-align:right"><b class="good">${gbp(tot(s,'a'))}</b><div class="mut">plan ${gbp(tot(s,'p'))}</div></div><span class="mut">›</span></div>`}).join('')}
<label style="margin-top:8px">Open another month</label><input type="month" min="${TL[V.tl].s}" max="${TL[V.tl].e}" onchange="if(this.value)go('mon',this.value)"></div>
<div class="card"><h3>Owed to you</h3>${S.owed.map(x=>`<div class="r" style="grid-template-columns:1fr 90px 24px 24px">${I(x.w,`u('owed','${x.id}','w',this.value)`,'text','Who')}${I(x.a,`u('owed','${x.id}','a',this.value)`,'number')}${C(x.k,`u('owed','${x.id}','k',this.checked)`)}<button class="x" onclick="del('owed','${x.id}')">×</button></div>`).join('')}
<div class="row"><span>Outstanding</span><b class="bad">${gbp(S.owed.filter(x=>!x.k).reduce((q,x)=>q+(+x.a||0),0))}</b></div><button class="btn s" onclick="S.owed.push({id:uid(),w:'',a:0,k:false});save();render()">+ Add</button></div>`}

function pSet(){return `<button class="bk" onclick="go('sum')">‹ Back</button>
<div class="card"><h3>Profile</h3><div style="display:flex;gap:14px;align-items:center">${av(S.prof,S.name,72)}<div style="flex:1">${I(S.name,`S.name=this.value;save();render()`,'text','Your name')}${up('prof','')}</div></div>${S.prof?`<button class="btn s" onclick="S.prof='';save();render()">Remove picture</button>`:''}</div>
<div class="card"><h3>Appearance</h3><label>Mode</label><div class="seg">${[['auto','◐ Auto'],['light','☀︎ Light'],['dark','☾ Dark']].map(x=>`<button class="${S.theme==x[0]?'on':''}" onclick="S.theme='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div>
<label style="margin-top:12px">Theme</label><div class="sw">${Object.entries(PAL).map(([k,p])=>`<button class="${S.pal==k?'on':''}" onclick="S.pal='${k}';save();render()"><i style="background:linear-gradient(135deg,${p[1]},${p[2]})"></i>${p[0]}</button>`).join('')}</div></div>
<div class="card"><h3>Links</h3>${S.links.map(l=>`<div class="sh"><div style="display:flex;gap:10px;align-items:center">${av(l.img,l.n,44)}<div style="flex:1">${I(l.n,`u('links','${l.id}','n',this.value)`,'text','Name')}</div><button class="x" onclick="del('links','${l.id}')">×</button></div><div style="margin-top:6px">${I(l.u,`u('links','${l.id}','u',this.value)`,'text','https://…')}${up('links',l.id)}</div></div>`).join('')||'<div class="mut">No links yet.</div>'}<button class="btn" onclick="S.links.push({id:uid(),n:'',u:'',img:''});save();render()">+ Add link</button></div>
<div class="card"><h3>Backup · import / export profile</h3><div class="mut">Export saves your name, picture, theme, links, income streams, shifts and all months. Importing replaces the data on this device.</div><button class="btn" onclick="expF()">Export profile (file)</button><button class="btn s" onclick="expC()">Copy profile to clipboard</button><label class="btn s" style="margin-top:8px">Import profile file<input type="file" accept=".json,application/json" hidden onchange="impF(this)"></label><label style="margin-top:10px">Or paste exported profile text</label><textarea id="pt" placeholder="Paste here"></textarea><button class="btn s" onclick="imp($('#pt').value)">Import pasted text</button>${V.msg?`<div class="mut" style="margin-top:8px">${E(V.msg)}</div>`:''}</div>`}

function pInc(){const m=V.im,r=inc(m);
if(V.st){const s=S.streams.find(x=>x.id==V.st);if(s)return pStream(s,r.per.find(x=>x.s.id==s.id));V.st=null}
let G=0,N=0,c=0;allM().forEach(k=>{const i=inc(k);G+=i.g;N+=i.n;c++});
return `<div class="card"><h3>Dashboard</h3><div class="g2"><div class="st"><span class="mut">Gross total</span><b>${gbp(G)}</b></div><div class="st"><span class="mut">Net total</span><b>${gbp(N)}</b></div><div class="st"><span class="mut">Average net income / month</span><b>${gbp(c?N/c:0)}</b></div><div class="st"><span class="mut">Average gross income / month</span><b>${gbp(c?G/c:0)}</b></div></div></div>
<div class="card"><h3>Net income by month</h3>${chart()}</div>
${mnav('im')}
<div class="card">${r.per.map(p=>`<div class="row lk" onclick="V.st='${p.s.id}';V.ed=false;scrollTo(0,0);render()"><span style="display:flex;gap:10px;align-items:center">${av(p.s.img,p.s.name,40)}<span>${nm(p.s)}<div class="mut">${p.h}h · gross ${gbp(p.g)}</div></span></span><span><b class="good">${gbp(p.n)}</b> <span class="mut">›</span></span></div>`).join('')||'<div class="mut">No income streams yet.</div>'}
<div class="row"><b>${mn(m)} total</b><span><span class="mut">${r.h}h · tax ${gbp(r.g-r.n)} ·</span> <b class="good">${gbp(r.n)}</b></span></div></div>
<button class="btn" onclick="ast()">+ Add income stream</button>`}

function pStream(s,p){const m=V.im,ft=s.type=='ft',sh=S.shifts.filter(x=>x.s==s.id&&inP(s,m,x.d)).sort((a,b)=>a.d<b.d?-1:1),under=Math.max(0,s.l1/(s.rate||1)-p.h);
const f=(k,l,t='number')=>L(l,I(s[k],`u('streams','${s.id}','${k}',this.value)`,t));
return `<button class="bk" onclick="V.st=null;V.ed=false;render()">‹ Income dashboard</button>
<div class="card"><div style="display:flex;gap:12px;align-items:center">${av(s.img,s.name,56)}<div style="flex:1;font-size:20px">${nm(s)}</div><button class="tb" onclick="V.ed=!V.ed;render()">${V.ed?'Done':'Edit'}</button></div>
${V.ed?`<div style="margin-top:10px">${up('streams',s.id)}<label>Type</label><div class="seg" style="margin-bottom:8px"><button class="${ft?'':'on'}" onclick="u('streams','${s.id}','type','pt')">Part-time</button><button class="${ft?'on':''}" onclick="u('streams','${s.id}','type','ft')">Full-time</button></div>
<div class="g2">${f('name','Income stream name','text')}${ft?f('sal','Monthly salary (£)'):f('rate','Rate / hr (£)')}</div>
${ft?'':`<div style="margin-top:8px">${L('Pay cut-off date for '+mn(m)+' (shifts after it roll into next month)',I(cut(s,m),`setCut('${s.id}','${m}',this.value)`,'date'))}</div>`}
<div class="seg" style="margin:8px 0"><button class="${s.b?'on':''}" style="font-weight:800" onclick="u('streams','${s.id}','b',${!s.b})">Bold</button><button class="${s.i?'on':''}" style="font-style:italic" onclick="u('streams','${s.id}','i',${!s.i})">Italic</button></div>
<div class="g2">${f('t1','Tax 20 (%) — up to NI limit')}${f('t2','Tax 20 + NI (%) — over NI limit')}${f('t3','Tax 40 + NI (%) — over upper limit')}${f('l1','NI limit £')}${f('l2','Upper limit £')}</div>
${s.img?`<button class="btn s" onclick="u('streams','${s.id}','img','')">Remove picture</button>`:''}
<button class="btn s" style="color:var(--bad)" onclick="delS('${s.id}')">${V.dc==s.id?'Tap again to confirm delete':'Delete stream'}</button></div>`:`<div class="mut" style="margin-top:8px">${ft?'Full-time · salary '+gbp(s.sal)+'/month':'Part-time · '+gbp(s.rate)+'/hr'} · whole pay taxed at ${s.t1}% up to ${gbp(s.l1)}, ${s.t2}% from ${gbp(s.l1)} to ${gbp(s.l2)}, ${s.t3}% above.</div>`}</div>
${mnav('im')}
${ft?`<div class="card"><div class="row"><span>${mn(m)} salary <b>${gbp(s.sal)}</b><div class="mut">Tick when paid</div></span>${C(s.paid&&s.paid[m],`setPaid('${s.id}','${m}',this.checked)`)}</div></div>`:`<div class="card"><div class="mut">Hours under NI limit (${gbp(s.l1)}) this month: <b>${under.toFixed(1)}h</b> · rate applied: <b>${rt(p.g,s)}%</b><br>Pay period: ${per(s,m)[0]} → ${per(s,m)[1]}</div><div class="tbs" style="margin-top:8px"><div class="r hd" style="grid-template-columns:128px 50px 1fr 24px 22px"><span>Date</span><span>Hrs</span><span>Shift</span><span>✓</span><span></span></div>${sh.map(x=>`<div class="r" style="grid-template-columns:128px 50px 1fr 24px 22px">${I(x.d,`u('shifts','${x.id}','d',this.value)`,'date')}${I(x.h,`u('shifts','${x.id}','h',this.value)`,'number','Hrs')}${I(x.n,`u('shifts','${x.id}','n',this.value)`,'text','Name')}${C(x.k,`u('shifts','${x.id}','k',this.checked)`)}<button class="x" onclick="del('shifts','${x.id}')">×</button></div>`).join('')}<div class="r" style="grid-template-columns:128px 50px 1fr 24px 22px;border:0;font-weight:700"><span>Total</span><span>${p.h}</span><span></span><span></span><span></span></div></div>
<button class="btn s" onclick="ash('${s.id}')">+ Add shift</button></div>`}
<div class="g2"><div class="card st"><span class="mut">Total hours</span><b>${p.h}</b></div><div class="card st"><span class="mut">Gross pay</span><b>${gbp(p.g)}</b></div><div class="card st"><span class="mut">Net pay</span><b class="good">${gbp(p.n)}</b></div><div class="card st"><span class="mut">Tax</span><b class="bad">${gbp(p.g-p.n)}</b></div></div>`}

function sec(m,k,t,debt){const a=M(m)[k],c=debt?'1fr 54px 58px 58px 24px 22px':'1fr 64px 64px 24px 22px';
return `<div class="card"><h3>${t}</h3><div class="r hd" style="grid-template-columns:${c}"><span>Name</span>${debt?'<span>Due</span>':''}<span>Planned</span><span>Actual</span><span>✓</span><span></span></div>
${a.map(x=>{const q=f=>`mi('${m}','${k}','${x.id}','${f}',this.value)`;return `<div class="r" style="grid-template-columns:${c}">${I(x.n,q('n'))}${debt?I(x.d,q('d'),'number'):''}${I(x.p,q('p'),'number')}${I(x.a,q('a'),'number')}${C(x.k,`mi('${m}','${k}','${x.id}','k',this.checked)`)}<button class="x" onclick="md('${m}','${k}','${x.id}')">×</button></div>`}).join('')}
<div class="r" style="grid-template-columns:${c};border:0;font-weight:700"><span>Total</span>${debt?`<span>${tot(a,'d').toFixed(0)}</span>`:''}<span>${gbp(tot(a,'p'))}</span><span>${gbp(tot(a,'a'))}</span><span></span><span></span></div><button class="btn s" onclick="ma('${m}','${k}')">+ Add</button></div>`}

function bills(m){const a=M(m).bills,c='1fr 84px 24px 22px';
return `<div class="card"><h3>Bills</h3><div class="r hd" style="grid-template-columns:${c}"><span>Name</span><span>Amount</span><span>Paid</span><span></span></div>${a.map(x=>{const q=f=>`mi('${m}','bills','${x.id}','${f}',this.value)`;return `<div class="r" style="grid-template-columns:${c}">${I(x.n,q('n'))}${I(x.p,q('p'),'number')}${C(x.k,`mi('${m}','bills','${x.id}','k',this.checked)`)}<button class="x" onclick="md('${m}','bills','${x.id}')">×</button></div>`}).join('')}<div class="r" style="grid-template-columns:${c};border:0;font-weight:700"><span>Total</span><span>${gbp(tot(a,'p'))}</span><span></span><span></span></div><button class="btn s" onclick="ma('${m}','bills')">+ Add</button></div>`}
function pMon(){const m=V.m,d=M(m),pl=inc(m),ac=inc(m,true);
const sp=[tot(d.bills,'p')+tot(d.exp,'p'),d.bills.filter(x=>x.k).reduce((a,x)=>a+(+x.p||0),0)+tot(d.exp,'a')],db=[tot(d.debt,'p'),tot(d.debt,'a')],sv=[tot(d.sav,'p'),tot(d.sav,'a')];
const left=[pl.n-sp[0]-db[0]-sv[0],ac.n-sp[1]-db[1]-sv[1]];
const tb=rows=>`<table class="tbl"><tr><th></th><th>Budget</th><th>Actual</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${gbp(r[1])}</td><td class="${r[3]||''}">${gbp(r[2])}</td></tr>`).join('')}</table>`;
return `<div class="nav"><button onclick="V.m=cl(sm(V.m,-1));render()">‹</button>${mn(m)}<button onclick="V.m=cl(sm(V.m,1));render()">›</button></div>
<div class="card" style="text-align:center"><div class="mut">Left over</div><div class="big ${left[1]<0?'bad':'good'}" style="font-size:46px">${gbp(left[1])}</div><div class="mut">Budget left over: <b>${gbp(left[0])}</b></div></div>
<div class="card"><h3>Overview · budget vs actual</h3>${tb([['Income',pl.n,ac.n],['Spent',sp[0],sp[1]],['Debt',db[0],db[1]],['Saved',sv[0],sv[1],'good']])}</div>
<div class="card"><h3>Income</h3><table class="tbl"><tr><th></th><th>Net</th></tr>${pl.per.map(p=>`<tr><td>${nm(p.s)}</td><td>${gbp(p.n)}</td></tr>`).join('')}<tr><td>Total</td><td class="good">${gbp(pl.n)}</td></tr></table></div>
${bills(m)}${sec(m,'exp','Expenses')}${sec(m,'sav','Savings')}${sec(m,'debt','Debt',1)}`}

function render(){const y=scrollY;apply();
const top=V.tab=='sum'?`<div class="top">${av(S.prof,S.name,46)}<h1>Welcome${S.name?' '+E(S.name):''}</h1><button class="tb" onclick="go('set')" aria-label="Settings">⚙︎</button></div>`:`<div class="top"><h1>${{inc:'Income',mon:mn(V.m).split(' ')[0],set:'Settings'}[V.tab]}</h1></div>`;
$('#app').innerHTML=top+{sum:pSum,inc:pInc,mon:pMon,set:pSet}[V.tab]();
document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t==(V.tab=='set'?'sum':V.tab)));scrollTo(0,y)}
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,ev=>ev.preventDefault()));
render();
</script></body></html>
